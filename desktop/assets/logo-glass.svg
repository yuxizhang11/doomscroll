<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72" width="72" height="72">
  <!-- Glas-Fassung des Logos (DESIGN.md 6c) für die Oberfläche in der Glas-Stufe „voll“: gleiche Form wie logo.svg, mit Tiefe statt flacher Fläche. Nicht für Symbole des Systems. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EE6A6A" stop-opacity=".88"/>
      <stop offset="1" stop-color="#B02E2E" stop-opacity=".66"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#4A0F0F" stop-opacity=".55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect x="20" y="19" width="68" height="68" rx="16" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="21" y="20" width="66" height="33" rx="15" fill="url(#gloss)"/>
  <rect x="20.75" y="19.75" width="66.5" height="66.5" rx="15.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <g filter="url(#shadow)">
    <path d="M42,30 L66,30 Q70,30 70,34 L70,74 Q70,78 66,78 L42,78 Q38,78 38,74 L38,34 Q38,30 42,30 Z" fill="none" stroke="#FFFFFF" stroke-opacity=".96" stroke-width="5"/>
    <path d="M30,52 L78,52 L78,58 L30,58 Z" fill="#FFFFFF" fill-opacity=".96"/>
  </g>
</svg>
